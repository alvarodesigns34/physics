# Comprobaciones en cada push y pull request: tipos, pruebas, compilación, E2E, accesibilidad y resiliencia.
name: Comprobaciones

on:
  push:
    # En main, estas mismas comprobaciones las ejecuta el flujo de publicación antes de desplegar.
    branches-ignore: [main]
  pull_request:
  # ATOM 6.0: el flujo de publicación llama a este mismo flujo y solo despliega si TODO pasa
  # (tipos, pruebas, compilación, E2E, accesibilidad y resiliencia).
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Prueba de humo de extremo a extremo (escritorio y móvil) con esperas basadas en estados observables
      - run: npm run e2e
      - name: Accesibilidad (axe-core, sin infracciones graves)
        run: npm run a11y
      - name: Resiliencia ante almacenamiento dañado
        run: npm run resilience
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-e2e
          path: test-results
          retention-days: 7
